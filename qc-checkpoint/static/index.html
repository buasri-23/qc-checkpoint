<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QC Checkpoint</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2F73;--blue:#1F6FEB;--sky:#DCEBFF;--bg:#F4F8FF;--card:#FFFFFF;
  --line:#C8DBF6;--ink:#12233F;--muted:#5C7196;--amber:#FFC93C;--on-blue:#FFFFFF;
  --side:#0B2F73;--r:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#9CC2FF;--blue:#3B82F6;--sky:#1B2F52;--bg:#0C1730;--card:#13223F;--line:#27406B;--ink:#E6EEFB;--muted:#93A8CB;--side:#08122A;}}
:root[data-theme="dark"]{--navy:#9CC2FF;--blue:#3B82F6;--sky:#1B2F52;--bg:#0C1730;--card:#13223F;--line:#27406B;--ink:#E6EEFB;--muted:#93A8CB;--side:#08122A;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;line-height:1.55}
#root{min-height:100%;display:flex}
aside{width:236px;background:var(--side);color:#fff;padding:20px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;align-self:flex-start}
aside h1{font-size:1.1rem;margin:0 8px 18px;font-weight:700}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:#CFE0FF;font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:var(--blue);color:#fff;font-weight:600}
.nav .n{float:right;background:var(--amber);color:#12233F;border-radius:99px;padding:0 8px;font-size:.78rem;font-weight:700}
main{flex:1;padding:24px clamp(16px,4vw,40px);max-width:980px;min-width:0}
h2{color:var(--navy);font-size:1.5rem;margin:0 0 16px}
h3{color:var(--navy);font-size:1.1rem;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1;min-width:160px}
label{display:block;font-size:.9rem;font-weight:500;margin-bottom:10px}
input,textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(.88)}
.btn.ghost{background:var(--sky);color:var(--navy)}
.badge{display:inline-block;padding:1px 12px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--sky);color:var(--navy)}
.badge.alert{background:var(--amber);color:#12233F}
.badge.done{background:var(--blue);color:#fff}
.steps{display:flex;gap:5px;margin:10px 0 4px}
.step{flex:1;text-align:center;font-size:.72rem;padding:6px 3px;border-radius:6px;background:var(--sky);color:var(--navy);opacity:.6}
.step.past{background:var(--blue);color:#fff;opacity:1}
.step.on{background:var(--navy);color:var(--bg);opacity:1;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat b{display:block;font-size:1.8rem;color:var(--navy)}
.log{font-size:.85rem;margin:6px 0 0;padding:0;list-style:none}
.log li{padding:3px 0;border-top:1px dashed var(--line)}
.err{color:#C62828;font-size:.9rem;margin:0 0 10px}
.ok{color:#1B7F3B;font-size:.9rem;margin:0 0 10px}
details summary{cursor:pointer;color:var(--blue);font-size:.88rem;margin-top:8px}
@media(max-width:720px){
  #root{flex-direction:column}
  aside{width:100%;height:auto;position:sticky;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:10px}
  aside h1{display:none}
  .nav{white-space:nowrap;width:auto;margin:0}
  .step{font-size:.62rem}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement, { useState, useEffect } = React;
const el = (t, p, ...c) => h(t, p, ...c);

const FOUND='found', ACK='ack', REC='recorded', FIXED='fixed', RESUMED='resumed';
const STEPS=[FOUND,ACK,REC,FIXED,RESUMED];
const LABEL={found:'ตรวจพบปัญหา',ack:'รับทราบปัญหา กำลังแก้ไข',recorded:'บันทึกแก้ไขแล้ว รอ Update',fixed:'แก้ไขเสร็จสิ้น',resumed:'ตรวจชิ้นงานต่อ'};
const fmt=t=>{const d=new Date(t);return isNaN(d)?t:d.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'medium'});};


const Badge=({s})=>el('span',{className:'badge '+(s===FOUND?'alert':(s===FIXED||s===RESUMED)?'done':'')},LABEL[s]);
const Stepper=({s})=>{
  const i=STEPS.indexOf(s);
  return el('div',{className:'steps'},STEPS.map((x,n)=>el('div',{key:x,className:'step '+(n===i?'on':n<i?'past':'')},LABEL[x])));
};
const Empty=({t})=>el('div',{className:'card muted'},t);

function IssueCard({r,children}){
  return el('div',{className:'card'},
    el('div',null,el('b',null,`#${r.id} · ${r.checkpoint}`),' ',el(Badge,{s:r.status})),
    el('div',{className:'muted'},`ID ที่ตรวจพบ: ${r.scanned} | ID ที่ถูกต้อง: ${r.expected} | ${fmt(r.created)}`+(r.photo?` | รูป: ${r.photo}`:'')),
    r.note&&el('div',{className:'muted'},'หมายเหตุ: '+r.note),
    el(Stepper,{s:r.status}),
    children,
    el('details',null,el('summary',null,'ประวัติการทำงาน'),
      el('ul',{className:'log'},r.log.map((l,i)=>el('li',{key:i},el('span',{className:'muted'},fmt(l.ts)+' '),el('b',null,l.who+': '),l.text)))));
}

function QCPage({issues,create,setStatus}){
  const [f,setF]=useState({checkpoint:'',expected:'',scanned:'',note:'',photo:''});
  const [msg,setMsg]=useState(null);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const submit=async e=>{
    e.preventDefault();
    if(!f.checkpoint||!f.expected||!f.scanned) return setMsg({err:'กรอก Checkpoint, ID ที่ถูกต้อง และ ID ที่ตรวจพบให้ครบ'});
    if(f.scanned.trim()===f.expected.trim()){ setMsg({ok:'ID ถูกต้อง ตรวจชิ้นงานต่อได้'}); }
    else{ try{ const id=await create(f); setMsg({err:`ตรวจพบ ID ไม่ถูกต้อง สร้างรายการ #${id} และแจ้ง Backoffice แล้ว`}); }catch(x){ setMsg({err:x.message}); } }
    setF({checkpoint:'',expected:'',scanned:'',note:'',photo:''}); e.target.reset();
  };
  return el('div',null,
    el('h2',null,'เจ้าหน้าที่ QC · Application'),
    el('form',{className:'card',onSubmit:submit},
      el('div',{className:'row'},
        el('label',null,'Checkpoint',el('input',{value:f.checkpoint,onChange:set('checkpoint'),placeholder:'เช่น CP-03'})),
        el('label',null,'ID ที่ถูกต้อง',el('input',{value:f.expected,onChange:set('expected'),placeholder:'เช่น A-1024'})),
        el('label',null,'ID ที่ตรวจพบ',el('input',{value:f.scanned,onChange:set('scanned'),placeholder:'เช่น A-1042'}))),
      el('label',null,'รูปถ่าย Checkpoint',el('input',{type:'file',accept:'image/*',capture:'environment',onChange:e=>setF({...f,photo:e.target.files[0]?e.target.files[0].name:''})})),
      el('label',null,'หมายเหตุ (ไม่บังคับ)',el('input',{value:f.note,onChange:set('note')})),
      msg&&el('p',{className:msg.err?'err':'ok'},msg.err||msg.ok),
      el('button',{className:'btn',type:'submit'},'บันทึกผลตรวจ')),
    el('h3',null,'รายการของฉัน'),
    issues.length===0?el(Empty,{t:'ยังไม่มีรายการปัญหา บันทึกผลตรวจด้านบนเพื่อเริ่ม'}):
    issues.map(r=>el(IssueCard,{key:r.id,r},
      r.status===FIXED?el('button',{className:'btn',onClick:()=>setStatus(r.id,RESUMED,'Application','ปรับสถานะให้ทำงานขั้นตอนต่อไปได้ → เจ้าหน้าที่ตรวจชิ้นงานต่อ')},'ตรวจชิ้นงานต่อ'):
      r.status!==RESUMED?el('div',{className:'muted'},'รอแก้ไข ยังทำงานขั้นตอนต่อไปไม่ได้'):null)));
}

function BackofficePage({issues,setStatus}){
  const [tab,setTab]=useState('list');
  const open=issues.filter(r=>[FOUND,ACK,REC].includes(r.status));
  const wait=issues.filter(r=>r.status===REC);
  const rows=tab==='list'?open:wait;
  return el('div',null,el('h2',null,'Backoffice'),
    el('div',{className:'row',style:{marginBottom:12}},
      el('button',{className:'btn '+(tab==='list'?'':'ghost'),onClick:()=>setTab('list')},`รายการมีปัญหา (${open.length})`),
      el('button',{className:'btn '+(tab==='wait'?'':'ghost'),onClick:()=>setTab('wait')},`รอ Update สถานะ (${wait.length})`)),
    rows.length===0?el(Empty,{t:tab==='list'?'ไม่มีรายการปัญหาค้างอยู่':'ไม่มีรายการที่รอ Update'}):
    rows.map(r=>el(IssueCard,{key:r.id,r},
      r.status===FOUND&&el('span',{className:'badge alert'},'แจ้งเตือนหัวหน้าไลน์ QC แล้ว'),
      r.status===REC&&el('div',null,el('p',null,'บันทึกการแก้ไข: '+r.fixNote),
        el('button',{className:'btn',onClick:()=>setStatus(r.id,FIXED,'Backoffice','Update สถานะชิ้นงาน → แก้ไขเสร็จสิ้น')},'Update สถานะ → แก้ไขเสร็จสิ้น')))));
}

function SupervisorPage({issues,setStatus,record}){
  const [txt,setTxt]=useState({});
  const [err,setErr]=useState(null);
  const rows=issues.filter(r=>[FOUND,ACK].includes(r.status));
  const nf=issues.filter(r=>r.status===FOUND).length;
  return el('div',null,el('h2',null,'หัวหน้าไลน์ QC'),
    nf>0&&el('div',{className:'card'},el('span',{className:'badge alert'},'แจ้งเตือน'),` พบชิ้นงานมีปัญหา ${nf} รายการ`),
    rows.length===0?el(Empty,{t:'ไม่มีงานที่ต้องแก้ไข'}):
    rows.map(r=>el(IssueCard,{key:r.id,r},
      r.status===FOUND?el('button',{className:'btn',onClick:()=>setStatus(r.id,ACK,'หัวหน้าไลน์ QC','ตรวจเช็คข้อมูลใน BackOffice → รับทราบปัญหากำลังแก้ไข')},'รับทราบ · เริ่มแก้ไข'):
      el('div',null,
        el('label',null,'บันทึกข้อมูลการแก้ไข',el('textarea',{rows:2,value:txt[r.id]||'',onChange:e=>setTxt({...txt,[r.id]:e.target.value})})),
        err===r.id&&el('p',{className:'err'},'ระบุรายละเอียดการแก้ไข'),
        el('button',{className:'btn',onClick:()=>{ if(!(txt[r.id]||'').trim()) return setErr(r.id); setErr(null); record(r.id,txt[r.id].trim()); }},'บันทึกข้อมูลการแก้ไข')))));
}

function Overview({issues}){
  return el('div',null,el('h2',null,'ภาพรวมระบบ'),
    el('div',{className:'stats'},STEPS.map(s=>el('div',{key:s,className:'card stat'},el('b',null,issues.filter(r=>r.status===s).length),el('span',{className:'muted'},LABEL[s])))),
    el('h3',null,'ขั้นตอนการทำงาน'),
    el('div',{className:'card'},el('ol',null,
      el('li',null,'เจ้าหน้าที่ QC เปิด App ถ่ายรูปจุด Checkpoint'),
      el('li',null,'Application ตรวจพบ ID ไม่ถูกต้อง → ตรวจพบปัญหา → ส่งข้อมูลไป Backoffice'),
      el('li',null,'Backoffice แสดงรายการและแจ้งเตือนหัวหน้าไลน์ QC'),
      el('li',null,'หัวหน้าไลน์ QC ตรวจเช็ค → รับทราบปัญหากำลังแก้ไข → แก้ไขและบันทึกข้อมูล'),
      el('li',null,'Backoffice Update สถานะ → แก้ไขเสร็จสิ้น'),
      el('li',null,'Application ปรับสถานะให้ทำงานต่อได้ → เจ้าหน้าที่ตรวจชิ้นงานต่อ'))),
    null);
}

const api=async(path,opt={})=>{
  const res=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opt});
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.detail||res.statusText); }
  return res.json();
};
function App(){
  const [issues,setIssues]=useState([]);
  const [page,setPage]=useState('qc');
  const [error,setError]=useState(null);
  const [loading,setLoading]=useState(true);
  const refresh=()=>api('/issues').then(d=>{setIssues(d);setError(null);}).catch(e=>setError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: '+e.message)).finally(()=>setLoading(false));
  useEffect(()=>{refresh();const t=setInterval(refresh,5000);return()=>clearInterval(t);},[]);
  const act=(id,action,fix_note)=>api(`/issues/${id}/${action}`,{method:'POST',body:JSON.stringify({fix_note})}).then(refresh).catch(e=>{setError(e.message);refresh();});
  const create=async f=>{const r=await api('/issues',{method:'POST',body:JSON.stringify(f)});await refresh();return r.id;};
  const ACT={ack:'ack',fixed:'fix',resumed:'resume'};
  const setStatus=(id,status)=>act(id,ACT[status]);
  const record=(id,note)=>act(id,'record',note);
  const nav=[['qc','เจ้าหน้าที่ QC'],['bo','Backoffice',issues.filter(r=>r.status===REC).length],['sv','หัวหน้าไลน์ QC',issues.filter(r=>r.status===FOUND).length],['ov','ภาพรวม']];
  const p={issues,create,setStatus,record};
  return el(React.Fragment,null,
    el('aside',null,el('h1',null,'🔷 QC Checkpoint'),
      nav.map(([k,t,n])=>el('button',{key:k,className:'nav '+(page===k?'on':''),onClick:()=>setPage(k)},t,n>0&&el('span',{className:'n'},n)))),
    el('main',null,
      error&&el('p',{className:'err',role:'alert'},error),
      loading?el(Empty,{t:'กำลังเชื่อมต่อเซิร์ฟเวอร์ (หากเซิร์ฟเวอร์เพิ่งตื่นอาจใช้เวลาประมาณ 1 นาที)...'}):
      page==='qc'?el(QCPage,p):page==='bo'?el(BackofficePage,p):page==='sv'?el(SupervisorPage,p):el(Overview,p)));
}
ReactDOM.createRoot(document.getElementById('root')).render(el(App));
</script>
</body>
</html>
